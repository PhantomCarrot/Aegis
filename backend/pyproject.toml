[project]
name = "aegis-backend"
version = "0.1.0"
description = "Aegis execution backend — agent loop, guardrails, RAG, infra tools"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "httpx>=0.27",
    "asyncssh>=2.18",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
]

# `llm.provider: airllm` (see app/config/schema.py, docs/llm-providers.md)
# needs torch/transformers/accelerate — several GB, and useless to anyone
# not using that provider, so it's opt-in: `uv sync --extra airllm`.
[project.optional-dependencies]
airllm = ["airllm>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
