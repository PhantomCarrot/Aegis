services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build: ./backend
    ports:
      # Host:container — only the host side needs to avoid local port
      # collisions (e.g. an SSH tunnel already using 8765); the container's
      # internal port stays 8765, see backend/Dockerfile.
      - "8766:8765"
    environment:
      AEGIS_BACKEND_TOKENS: ${AEGIS_BACKEND_TOKENS:-changeme-dev-token}
      AEGIS_ALLOWED_ORIGINS: ${AEGIS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional — publicly exposes the backend via Cloudflare Tunnel instead
  # of opening a port. Uncomment + set CLOUDFLARE_TUNNEL_TOKEN (generated
  # by `cloudflared tunnel token <tunnel-name>`) — see docs/deployment.md
  # for the full tunnel setup.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - backend

volumes:
  qdrant_storage:
