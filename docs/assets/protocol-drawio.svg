<svg viewBox="0 0 1040 806" xmlns="http://www.w3.org/2000/svg" role="img"
     style="color-scheme: light dark;"
     aria-label="SSE streaming sequence for a typical text-only chat turn: the agent loop yields internal events (Start, TextStart, repeated TextDelta, TextEnd, Finish) that the protocol encoder translates one-to-one into AI SDK UI Message Stream SSE events sent to useChat on the frontend, ending with a [DONE] marker.">
<title>Aegis SSE streaming sequence</title>
