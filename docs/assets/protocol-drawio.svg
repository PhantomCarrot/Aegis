<text x="335.0" y="586.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;fill:light-dark(#1a7f37, #57ae70);">Finish()</text>
<line x1="520.0" y1="642.0" x2="890.0" y2="642.0" style="stroke:light-dark(#1b7c83, #52a5ac);stroke-width:1.6;" marker-end="url(#arrow-teal)"/>
<text x="705.0" y="634.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;fill:light-dark(#1b7c83, #52a5ac);">finish-step</text>
<line x1="520.0" y1="690.0" x2="890.0" y2="690.0" style="stroke:light-dark(#1b7c83, #52a5ac);stroke-width:1.6;" marker-end="url(#arrow-teal)"/>
<text x="705.0" y="682.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;fill:light-dark(#1b7c83, #52a5ac);">finish</text>
