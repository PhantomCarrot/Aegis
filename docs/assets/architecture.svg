<svg viewBox="0 0 1080 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A chat request flows from the browser through a Next.js proxy to the self-hosted backend, which loops with the LLM for tool calls but is the only component that ever touches real infrastructure, over a local subprocess or SSH.">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="640" fill="#0d1117"/>

  <!-- ── Zones ─────────────────────────────────────────────────────── -->
  <rect x="196" y="40" width="192" height="176" rx="10" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="212" y="64" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#58a6ff">VERCEL / NEXT.JS</text>

  <rect x="420" y="40" width="380" height="470" rx="10" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="436" y="64" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#d29922">SELF-HOSTED BACKEND</text>
  <text x="436" y="80" font-family="system-ui,sans-serif" font-size="10" fill="#8b8560">local machine, or a remote host reached over SSH</text>

  <rect x="828" y="148" width="228" height="224" rx="10" fill="none" stroke="#a371f7" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="844" y="172" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#a371f7">LLM PROVIDER</text>
  <text x="844" y="188" font-family="system-ui,sans-serif" font-size="10" fill="#9b8bb0">local or remote</text>

  <!-- ── Browser ───────────────────────────────────────────────────── -->
  <rect x="24" y="120" width="140" height="64" rx="8" fill="#0d2547" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="94" y="147" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Browser</text>
  <text x="94" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8b949e">operator</text>

  <!-- ── Frontend ──────────────────────────────────────────────────── -->
  <rect x="216" y="88" width="152" height="80" rx="8" fill="#0d2547" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="292" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Frontend</text>
  <text x="292" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8b949e">UI + proxy Route</text>
  <text x="292" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8b949e">Handler</text>

  <!-- ── FastAPI + agent loop ─────────────────────────────────────── -->
  <rect x="448" y="96" width="332" height="82" rx="8" fill="#122318" stroke="#3fb950" stroke-width="1.5"/>
  <text x="614" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">FastAPI + agent loop</text>
  <text x="614" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8b949e">guardrails · secret anonymizer · confirmation flow</text>
  <text x="614" y="156" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8b949e">resolves tenant + provider from X-Tenant-Id</text>

  <!-- ── Exec ─────────────────────────────────────────────────────── -->
  <rect x="448" y="228" width="200" height="168" rx="8" fill="#2b2109" stroke="#d29922" stroke-width="1.5"/>
  <text x="548" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Exec</text>
  <text x="548" y="271" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8b949e">kubectl · az CLI · ArgoCD</text>
  <text x="548" y="286" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8b949e">run_command (guarded)</text>
  <line x1="468" y1="300" x2="628" y2="300" stroke="#d29922" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="548" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#e6edf3">local subprocess —</text>
  <text x="548" y="335" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#e6edf3">or SSH to a configured host,</text>
  <text x="548" y="350" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#e6edf3">cert or key auth</text>
  <text x="548" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e">the only component that</text>
  <text x="548" y="386" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e">ever touches real infra</text>

  <!-- ── Qdrant ───────────────────────────────────────────────────── -->
  <rect x="672" y="228" width="108" height="100" rx="8" fill="#0a2b2b" stroke="#39c5cf" stroke-width="1.5"/>
  <text x="726" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Qdrant</text>
  <text x="726" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8b949e">RAG index</text>
  <text x="726" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8b949e">per tenant</text>
  <text x="726" y="304" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e">local or remote</text>

  <!-- ── LLM ──────────────────────────────────────────────────────── -->
  <rect x="852" y="200" width="180" height="128" rx="8" fill="#241a38" stroke="#a371f7" stroke-width="1.5"/>
  <text x="942" y="228" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Ollama / LM Studio</text>
  <text x="942" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">/ AirLLM</text>
  <text x="942" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#f85149">✗ no exec, no infra access</text>
  <text x="942" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e">inference only —</text>
  <text x="942" y="298" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e">text or tool_call JSON out</text>

  <!-- ── Note ─────────────────────────────────────────────────────── -->
  <rect x="828" y="404" width="228" height="140" rx="8" fill="#2b2109" stroke="#d29922" stroke-width="1.5"/>
  <text x="844" y="428" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#d29922">The LLM never executes</text>
  <text x="844" y="448" font-family="system-ui,sans-serif" font-size="10" fill="#e6edf3">It returns text or a tool_call</text>
  <text x="844" y="464" font-family="system-ui,sans-serif" font-size="10" fill="#e6edf3">JSON — nothing more. Every</text>
  <text x="844" y="480" font-family="system-ui,sans-serif" font-size="10" fill="#e6edf3">command still passes through</text>
  <text x="844" y="496" font-family="system-ui,sans-serif" font-size="10" fill="#e6edf3">the guardrails at step 5, and</text>
  <text x="844" y="512" font-family="system-ui,sans-serif" font-size="10" fill="#e6edf3">only Exec ever reaches your</text>
  <text x="844" y="528" font-family="system-ui,sans-serif" font-size="10" fill="#e6edf3">infrastructure.</text>

  <!-- ── Step-number badges (drawn, not Unicode — renders everywhere) ── -->
  <g font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">
    <circle cx="146" cy="93" r="9" fill="#58a6ff"/><text x="146" y="96.5" fill="#0d1117">1</text>
    <circle cx="354" cy="93" r="9" fill="#58a6ff"/><text x="354" y="96.5" fill="#0d1117">2</text>
    <circle cx="794" cy="191" r="9" fill="#a371f7"/><text x="794" y="194.5" fill="#0d1117">3</text>
    <circle cx="794" cy="233" r="9" fill="#a371f7"/><text x="794" y="236.5" fill="#0d1117">4</text>
    <circle cx="397" cy="195" r="9" fill="#d29922"/><text x="397" y="198.5" fill="#0d1117">5</text>
    <circle cx="397" cy="233" r="9" fill="#d29922"/><text x="397" y="236.5" fill="#0d1117">6</text>
    <circle cx="794" cy="319" r="9" fill="#a371f7"/><text x="794" y="322.5" fill="#0d1117">7</text>
    <circle cx="196" cy="319" r="9" fill="#58a6ff"/><text x="196" y="322.5" fill="#0d1117">8</text>
  </g>

  <!-- ── Arrows ───────────────────────────────────────────────────── -->
  <!-- 1: browser -> frontend -->
  <line x1="164" y1="148" x2="212" y2="130" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="164" y="98" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#58a6ff">request</text>
  <text x="164" y="112" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e">HTTPS, same origin</text>

  <!-- 2: frontend -> backend -->
  <line x1="368" y1="124" x2="446" y2="120" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="372" y="98" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#58a6ff">Bearer token</text>
  <text x="372" y="112" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e">browser never sees it</text>

  <!-- 3: agent-loop -> llm -->
  <path d="M 780 122 C 815 122, 828 190, 850 214" fill="none" stroke="#a371f7" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <text x="812" y="196" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#a371f7">messages</text>
  <text x="812" y="210" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e">+ tool schemas</text>

  <!-- 4: llm -> agent-loop (dashed, tool_call) -->
  <path d="M 850 252 C 822 262, 812 152, 780 144" fill="none" stroke="#a371f7" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowPurple)"/>
  <text x="812" y="238" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#a371f7">tool_call JSON</text>
  <text x="812" y="252" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e">dashed = inference result</text>

  <!-- 5: agent-loop -> exec -->
  <line x1="548" y1="178" x2="548" y2="226" stroke="#d29922" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <text x="416" y="200" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#d29922">guardrail-checked</text>
  <text x="416" y="214" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e">command, if allowed</text>

  <!-- 6: exec -> agent-loop (dashed, result) -->
  <path d="M 468 226 C 452 208, 462 192, 496 178" fill="none" stroke="#d29922" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <text x="416" y="238" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#d29922">result</text>
  <text x="416" y="252" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e">secrets anonymized first</text>

  <!-- 7: agent-loop -> llm again (tool result, loop back) -->
  <path d="M 780 156 C 826 170, 840 300, 852 306" fill="none" stroke="#a371f7" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <text x="812" y="324" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#a371f7">tool result</text>
  <text x="812" y="338" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e">next round, or final answer</text>

  <!-- RAG: agent-loop <-> Qdrant, only when RAG mode is on — not part of the numbered turn -->
  <line x1="692" y1="178" x2="692" y2="226" stroke="#39c5cf" stroke-width="1.8" marker-end="url(#arrowTeal)"/>
  <line x1="760" y1="226" x2="760" y2="178" stroke="#39c5cf" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>
  <text x="726" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#39c5cf">RAG search (optional)</text>
  <text x="726" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#8b949e">chunks + citations</text>

  <!-- 8: backend -> browser (streamed, dashed, one sweeping return path via the frontend proxy) -->
  <path d="M 448 160 C 300 220, 210 260, 210 324 C 210 355, 150 360, 100 340 C 80 332, 74 250, 82 188"
        fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <text x="216" y="324" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#58a6ff">streamed</text>
  <text x="216" y="338" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e">SSE, via the frontend proxy</text>

  <!-- multi-round note under the backend zone -->
  <text x="614" y="500" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6e7681">steps 3–7 repeat for as many tool calls as one turn needs</text>
</svg>
