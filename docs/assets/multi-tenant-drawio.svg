<svg viewBox="0 0 1040 540" xmlns="http://www.w3.org/2000/svg" role="img"
     style="color-scheme: light dark;"
     aria-label="Tenant switch sequence: the browser writes the chosen tenant to localStorage and sends X-Tenant-Id on every request; the Next.js proxy forwards it unchanged; the FastAPI backend's resolve_tenant() reads the header, falling back to the default tenant if it's absent, and returns the resolved tenant.">
<title>Aegis tenant switch sequence</title>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#0969da, #56a8ff);"/></marker>
<marker id="tri-blue" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 13 5 L 1 9 Z" style="fill:light-dark(#f6f8fa, #17191b);stroke:light-dark(#0969da, #56a8ff);stroke-width:1.4;stroke-linejoin:round;"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#9a6700, #bb8f37);"/></marker>
<marker id="tri-amber" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 13 5 L 1 9 Z" style="fill:light-dark(#f6f8fa, #17191b);stroke:light-dark(#9a6700, #bb8f37);stroke-width:1.4;stroke-linejoin:round;"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#1b7c83, #52a5ac);"/></marker>
<marker id="tri-teal" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 13 5 L 1 9 Z" style="fill:light-dark(#f6f8fa, #17191b);stroke:light-dark(#1b7c83, #52a5ac);stroke-width:1.4;stroke-linejoin:round;"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#8250df, #af84ff);"/></marker>
<marker id="tri-purple" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 13 5 L 1 9 Z" style="fill:light-dark(#f6f8fa, #17191b);stroke:light-dark(#8250df, #af84ff);stroke-width:1.4;stroke-linejoin:round;"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#1a7f37, #57ae70);"/></marker>
<marker id="tri-green" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 13 5 L 1 9 Z" style="fill:light-dark(#f6f8fa, #17191b);stroke:light-dark(#1a7f37, #57ae70);stroke-width:1.4;stroke-linejoin:round;"/></marker>
<marker id="arrow-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#bf3989, #e990c7);"/></marker>
<marker id="tri-pink" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 13 5 L 1 9 Z" style="fill:light-dark(#f6f8fa, #17191b);stroke:light-dark(#bf3989, #e990c7);stroke-width:1.4;stroke-linejoin:round;"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#57606a, #969da6);"/></marker>
<marker id="tri-gray" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 13 5 L 1 9 Z" style="fill:light-dark(#f6f8fa, #17191b);stroke:light-dark(#57606a, #969da6);stroke-width:1.4;stroke-linejoin:round;"/></marker>
</defs>
<rect x="0" y="0" width="1040" height="540" style="fill:light-dark(#f6f8fa, #17191b);"/>
<g id="l-browser">
<rect x="35.0" y="30" width="230" height="60" rx="12" ry="12" style="fill:light-dark(#ddf4ff, #0e222b);stroke:light-dark(#0969da, #56a8ff);stroke-width:1.5;"/>
<text x="150.0" y="56.5" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:light-dark(#1f2328, #cdd0d4);">Browser</text>
<text x="150.0" y="73.5" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">TenantProvider</text>
</g>
<line x1="150" y1="90" x2="150" y2="520" style="stroke:light-dark(#0969da, #56a8ff);stroke-width:1.2;stroke-dasharray:4 4;opacity:0.55;"/>
<g id="l-proxy">
<rect x="405.0" y="30" width="230" height="60" rx="12" ry="12" style="fill:light-dark(#ddf4ff, #0e222b);stroke:light-dark(#0969da, #56a8ff);stroke-width:1.5;"/>
<text x="520.0" y="56.5" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:light-dark(#1f2328, #cdd0d4);">Next.js Proxy</text>
<text x="520.0" y="73.5" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">app/api/backend/[...path]</text>
</g>
<line x1="520" y1="90" x2="520" y2="520" style="stroke:light-dark(#0969da, #56a8ff);stroke-width:1.2;stroke-dasharray:4 4;opacity:0.55;"/>
<g id="l-backend">
<rect x="775.0" y="30" width="230" height="60" rx="12" ry="12" style="fill:light-dark(#fff8c5, #221c00);stroke:light-dark(#9a6700, #bb8f37);stroke-width:1.5;"/>
<text x="890.0" y="56.5" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:light-dark(#1f2328, #cdd0d4);">FastAPI Backend</text>
<text x="890.0" y="73.5" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">resolve_tenant()</text>
</g>
<line x1="890" y1="90" x2="890" y2="520" style="stroke:light-dark(#9a6700, #bb8f37);stroke-width:1.2;stroke-dasharray:4 4;opacity:0.55;"/>
<path d="M 150.0 134.0 C 185.2 132.0 185.2 150.0 152.0 150.0" fill="none" style="stroke:light-dark(#0969da, #56a8ff);stroke-width:1.6;" marker-end="url(#arrow-blue)"/>
<text x="191.2" y="140.0" text-anchor="start" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;fill:light-dark(#0969da, #56a8ff);">switchTenant("acme-corp")</text>
<text x="191.2" y="153.0" text-anchor="start" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;fill:light-dark(#0969da, #56a8ff);">writes to localStorage</text>
<line x1="150.0" y1="212.0" x2="520.0" y2="212.0" style="stroke:light-dark(#0969da, #56a8ff);stroke-width:1.6;" marker-end="url(#arrow-blue)"/>
<text x="335.0" y="191.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;fill:light-dark(#0969da, #56a8ff);">GET /api/backend/api/ping</text>
<text x="335.0" y="204.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;fill:light-dark(#0969da, #56a8ff);">(forwards all browser headers)</text>
<rect x="370.0" y="282.0" width="300" height="34" rx="6" ry="6" style="fill:light-dark(#eaeef2, #21262d);stroke:light-dark(#57606a, #969da6);stroke-width:1.2;"/>
<text x="520.0" y="296.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;fill:light-dark(#57606a, #969da6);">the browser sends X-Tenant-Id directly,</text>
<text x="520.0" y="310.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;fill:light-dark(#57606a, #969da6);">the proxy has nothing special to do here</text>
<line x1="520.0" y1="338.0" x2="890.0" y2="338.0" style="stroke:light-dark(#9a6700, #bb8f37);stroke-width:1.6;" marker-end="url(#arrow-amber)"/>
<text x="705.0" y="317.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;fill:light-dark(#9a6700, #bb8f37);">GET /api/ping</text>
<text x="705.0" y="330.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;fill:light-dark(#9a6700, #bb8f37);">Authorization: Bearer ... · X-Tenant-Id: acme-corp</text>
<path d="M 890.0 408.0 C 854.8 406.0 854.8 424.0 888.0 424.0" fill="none" style="stroke:light-dark(#9a6700, #bb8f37);stroke-width:1.6;" marker-end="url(#arrow-amber)"/>
<text x="848.8" y="414.0" text-anchor="end" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;fill:light-dark(#9a6700, #bb8f37);">resolve_tenant() reads the header,</text>
<text x="848.8" y="427.0" text-anchor="end" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;fill:light-dark(#9a6700, #bb8f37);">falls back to default_tenant if absent</text>
<line x1="890.0" y1="486.0" x2="150.0" y2="486.0" style="stroke:light-dark(#9a6700, #bb8f37);stroke-width:1.6;stroke-dasharray:6 4;" marker-end="url(#arrow-amber)"/>
<text x="520.0" y="478.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;fill:light-dark(#9a6700, #bb8f37);">{ tenant: { id: "acme-corp", ... } }</text>
</svg>
