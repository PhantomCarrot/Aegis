<text x="735.0" y="121.5" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:light-dark(#1f2328, #cdd0d4);">embeddings.py</text>
<text x="735.0" y="138.5" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">dense — Ollama nomic-embed-text</text>
</g>
<g id="sparseGen">
<rect x="620" y="220" width="230" height="70" rx="12" ry="12" style="fill:light-dark(#ffeff7, #2e1526);stroke:light-dark(#bf3989, #e990c7);stroke-width:1.5;"/>
<text x="735.0" y="251.5" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:light-dark(#1f2328, #cdd0d4);">sparse_embeddings.py</text>
<text x="735.0" y="268.5" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">sparse — fastembed BM25, local ONNX</text>
</g>
<g id="store">
<rect x="940" y="140" width="340" height="110" rx="12" ry="12" style="fill:light-dark(#d8f6f6, #0c2525);stroke:light-dark(#1b7c83, #52a5ac);stroke-width:1.5;"/>
<text x="1110.0" y="183.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:light-dark(#1f2328, #cdd0d4);">store.py → Qdrant</text>
<text x="1110.0" y="200.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">dense+sparse vectors, per-tenant collection</text>
