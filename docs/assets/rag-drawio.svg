<svg viewBox="0 0 1400 725" xmlns="http://www.w3.org/2000/svg" role="img"
     style="color-scheme: light dark;"
     aria-label="Aegis RAG pipeline: docs_gen.py scrapes the cluster into a Markdown doc, chunking.py splits it, dense and sparse embeddings are computed and stored in Qdrant via store.py. On a RAG-mode chat turn, the question is embedded the same two ways, store.py runs a hybrid dense+sparse search fused with RRF, anonymizer.py redacts secrets from the retrieved text, and context.py builds the cited context injected into the system prompt.">
<title>Aegis RAG pipeline</title>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#0969da, #56a8ff);"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#9a6700, #bb8f37);"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#1b7c83, #52a5ac);"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#8250df, #af84ff);"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#1a7f37, #57ae70);"/></marker>
<marker id="arrow-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#bf3989, #e990c7);"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#57606a, #969da6);"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="725" style="fill:light-dark(#f6f8fa, #17191b);"/>
<rect id="zoneGen" x="30" y="40" width="1340" height="280" rx="16" ry="16" fill="none" style="stroke:light-dark(#9a6700, #bb8f37);stroke-width:2;stroke-dasharray:8 6;"/>
<text x="50" y="66" style="font-family:'Courier New',monospace;font-size:13px;font-weight:700;letter-spacing:0.5px;fill:light-dark(#9a6700, #bb8f37);">GENERATION + INDEXING · POST /api/rag/generate</text>
<rect id="zoneSearch" x="30" y="350" width="1340" height="300" rx="16" ry="16" fill="none" style="stroke:light-dark(#0969da, #56a8ff);stroke-width:2;stroke-dasharray:8 6;"/>
<text x="50" y="376" style="font-family:'Courier New',monospace;font-size:13px;font-weight:700;letter-spacing:0.5px;fill:light-dark(#0969da, #56a8ff);">SEARCH · every RAG-mode chat turn</text>
<g id="docsGen">
<rect x="60" y="150" width="210" height="90" rx="12" ry="12" style="fill:light-dark(#fff8c5, #221c00);stroke:light-dark(#9a6700, #bb8f37);stroke-width:1.5;"/>
<text x="165.0" y="183.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:light-dark(#1f2328, #cdd0d4);">docs_gen.py</text>
<text x="165.0" y="200.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">scrapes kubectl → Markdown</text>
<text x="165.0" y="217.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">(ns · pods · deploy · svc)</text>
</g>
<g id="chunking">
<rect x="340" y="150" width="210" height="90" rx="12" ry="12" style="fill:light-dark(#eaeef2, #21262d);stroke:light-dark(#57606a, #969da6);stroke-width:1.5;"/>
<text x="445.0" y="183.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:light-dark(#1f2328, #cdd0d4);">chunking.py</text>
<text x="445.0" y="200.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">heading breadcrumb</text>
