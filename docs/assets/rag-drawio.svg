<text x="445.0" y="448.5" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">dense — same Ollama model</text>
</g>
<g id="sparseQ">
<rect x="330" y="520" width="230" height="70" rx="12" ry="12" style="fill:light-dark(#ffeff7, #2e1526);stroke:light-dark(#bf3989, #e990c7);stroke-width:1.5;"/>
<text x="445.0" y="551.5" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:light-dark(#1f2328, #cdd0d4);">embed_query_sparse()</text>
<text x="445.0" y="568.5" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">sparse — fastembed BM25</text>
</g>
