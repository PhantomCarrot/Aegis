<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img"
     style="color-scheme: light dark;"
     aria-label="CommandExecutor is an interface implemented by two classes: LocalExecutor, running a subprocess on the backend's own machine, and SSHExecutor, running commands on a remote host over a reused SSH connection. get_executor(tenant) picks the right one from the tenant's exec.mode.">
<title>Aegis CommandExecutor class diagram</title>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:light-dark(#0969da, #56a8ff);"/></marker>
