</defs>
<rect x="0" y="0" width="900" height="420" style="fill:light-dark(#f6f8fa, #17191b);"/>
<g id="iface">
<rect x="300" y="40" width="300" height="90" rx="12" ry="12" style="fill:light-dark(#eaeef2, #21262d);stroke:light-dark(#57606a, #969da6);stroke-width:1.5;"/>
<text x="450.0" y="73.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:light-dark(#1f2328, #cdd0d4);">CommandExecutor</text>
<text x="450.0" y="90.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">interface — app/exec/base.py</text>
<text x="450.0" y="107.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">run(cmd, env, timeout, shell)</text>
</g>
<g id="local">
<rect x="90" y="240" width="300" height="90" rx="12" ry="12" style="fill:light-dark(#ddf4ff, #0e222b);stroke:light-dark(#0969da, #56a8ff);stroke-width:1.5;"/>
<text x="240.0" y="273.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:light-dark(#1f2328, #cdd0d4);">LocalExecutor</text>
<text x="240.0" y="290.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">app/exec/local.py</text>
<text x="240.0" y="307.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">local asyncio subprocess</text>
</g>
<g id="ssh">
<rect x="510" y="240" width="300" height="90" rx="12" ry="12" style="fill:light-dark(#fff8c5, #221c00);stroke:light-dark(#9a6700, #bb8f37);stroke-width:1.5;"/>
<text x="660.0" y="273.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:light-dark(#1f2328, #cdd0d4);">SSHExecutor</text>
<text x="660.0" y="290.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">app/exec/ssh.py</text>
<text x="660.0" y="307.0" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">asyncssh, reused connection</text>
</g>
<path d="M 240.0 240.0 L 375.0 130.0" fill="none" style="stroke:light-dark(#57606a, #969da6);stroke-width:1.5;" marker-end="url(#tri-gray)"/>
<path d="M 660.0 240.0 L 525.0 130.0" fill="none" style="stroke:light-dark(#57606a, #969da6);stroke-width:1.5;" marker-end="url(#tri-gray)"/>
<rect x="210" y="355" width="480" height="45" rx="10" ry="10" style="fill:light-dark(#eaeef2, #21262d);stroke:light-dark(#57606a, #969da6);stroke-width:1.5;"/>
<text x="450.0" y="376" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:11.5px;font-weight:700;fill:light-dark(#57606a, #969da6);">get_executor(tenant) picks one</text>
<text x="450.0" y="393" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:10.5px;fill:light-dark(#57606a, #969da6);">resolves from tenant.exec.mode — cached per tenant for reused SSH connections</text>
</svg>
